name: Deploy IAM Service to VM

on:
  workflow_dispatch:  # Ручной запуск через GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: iam-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image
        run: |
          docker save iam-service:latest | gzip > iam-service.tar.gz

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          # Копируем образ на VM
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            iam-service.tar.gz $VM_USER@$VM_HOST:/tmp/

          # Деплой на VM
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $VM_USER@$VM_HOST << 'ENDSSH'
            set -e

            echo "🚀 Начало развертывания IAM Service..."

            # Загружаем Docker image
            echo "📦 Загрузка Docker образа..."
            docker load -i /tmp/iam-service.tar.gz

            # Останавливаем и удаляем старый контейнер
            echo "🛑 Остановка старого контейнера..."
            docker stop iam-service 2>/dev/null || true
            docker rm iam-service 2>/dev/null || true

            # Запускаем новый контейнер со всеми переменными
            echo "▶️  Запуск нового контейнера..."
            docker run -d \
              --name iam-service \
              --restart unless-stopped \
              -p 3000:3000 \
              -p 50051:50051 \
              -e PORT=50051 \
              -e REST_PROXY_PORT=3000 \
              -e NODE_ENV=production \
              -e DATABASE_URL="postgresql://postgres:password@localhost:5432/iam" \
              -e REDIS_HOST=localhost \
              -e REDIS_PORT=6379 \
              -e JWT_SECRET="your-super-secret-jwt-key-change-me" \
              -e CLINREC_BASE_URL="http://51.250.100.64:8000" \
              iam-service:latest

            # Очищаем старые images
            docker image prune -f

            # Удаляем временный файл
            rm -f /tmp/iam-service.tar.gz

            # Проверяем статус
            echo "✅ Проверка статуса контейнера..."
            docker ps | grep iam-service

            echo "🎉 Развертывание IAM Service завершено!"
          ENDSSH

      - name: Verify Deployment
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          echo "📋 Последние логи контейнера:"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            $VM_USER@$VM_HOST "docker logs --tail 30 iam-service"

      - name: Notify on Success
        if: success()
        run: echo "✅ IAM Service deployment successful!"

      - name: Notify on Failure
        if: failure()
        run: echo "❌ Deployment failed! Check the logs above."